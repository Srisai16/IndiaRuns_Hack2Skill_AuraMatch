ai_usage_summary: |
  Used Gemini (Antigravity pair-programming agent) for designing the logical rules, implementing the local hybrid ranking algorithms, and generating recruitement reasoning profiles. Standard python scripts run locally; no candidate data was transmitted online during ranking execution.

methodology_summary: |
  Hybrid vector-lexical ranker with deterministic honeypot pre-filters. Candidates are first filtered for logical and date contradictions (salary flips, job durations exceeding actual date ranges, zero-duration expert skills) to ensure 0% honeypot rate. Clean candidates are ranked using a hybrid scoring matrix: technical skills (dense embeddings, vector databases, RAG, search, evaluation), role fit (5-9 years experience band, current title, and service company penalty), and platform behavioral signals (active logins, recruiter response, interview rates, short notice periods). Top candidates are re-ranked using an LLM-in-the-loop layer (Antigravity) and stored in a lookup database for sub-10 second execution in offline sandboxes.

